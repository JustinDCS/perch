name: release

# Push a tag like v0.1.3 to build both installers.
#
# With the signing key set (see README, "Releasing and auto-update"), the builds are signed for the
# updater and a latest.json is attached, which is where installed copies of Perch look for new
# versions (the repository must be public for that). Without the key this still builds plain
# installers into a draft pre-release, as before.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: "", targets: "" }
          - { name: macOS, os: macos-latest, args: "--target universal-apple-darwin", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test

      - name: Check the update public key is filled in
        if: env.HAS_UPDATER == 'true'
        shell: bash
        run: |
          if grep -q REPLACE_WITH_PUBLIC_KEY src-tauri/tauri.updater.conf.json; then
            echo "src-tauri/tauri.updater.conf.json still has the placeholder public key" >&2
            exit 1
          fi

      # signed for the updater, with latest.json attached
      - uses: tauri-apps/tauri-action@v0
        if: env.HAS_UPDATER == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Perch ${{ github.ref_name }}
          releaseBody: "Perch ${{ github.ref_name }}. Installed copies update themselves. First time installing: see the README."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      # no update secrets: plain installers in a draft on this repo
      - uses: tauri-apps/tauri-action@v0
        if: env.HAS_UPDATER != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Perch ${{ github.ref_name }} (test build)
          releaseBody: "Test build. Not signed: see the README for how to open it."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
